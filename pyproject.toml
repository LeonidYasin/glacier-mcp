[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glacier-mcp"
version = "0.0.1"
description = "MCP server for interactive glacier mapping: GeoTIFF basemap, mouse-driven polygon editing, agent-accessible vertices, shapefile export."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Leonid Yasin" }]
keywords = ["mcp", "gis", "geospatial", "glacier", "openlayers", "geotiff", "shapefile", "remote-sensing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "mcp>=1.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/LeonidYasin/glacier-mcp"

[project.scripts]
glacier-mcp = "glacier_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "SLF",  # flake8-self (private member access)
]
ignore = [
    "ANN001",  # missing type annotation for function argument
    "ANN101",  # missing self annotation (removed in newer ruff)
    "ANN102",  # missing cls annotation (removed in newer ruff)
    "ANN201",  # missing return type for public function - too strict for tests
    "ANN202",  # missing return type for private function
    "ANN204",  # missing return type for __init__
    "ANN401",  # dynamically typed expressions (Any) - we use it deliberately
    "B008",    # function call in default arg - FastAPI Depends() pattern
]

[tool.ruff.lint.isort]
known-first-party = ["glacier_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
