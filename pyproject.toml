[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glacier-mcp"
version = "0.0.1"
description = "MCP server for interactive glacier mapping: GeoTIFF basemap, mouse-driven polygon editing, agent-accessible vertices, shapefile export."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Leonid Yasin" }]
keywords = ["mcp", "gis", "geospatial", "glacier", "openlayers", "geotiff", "shapefile", "remote-sensing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    # Pin mcp below 2.0: in mcp 2.x FastMCP was renamed to MCPServer and
    # the module moved (mcp.server.fastmcp -> mcp.server.mcpserver). Our
    # server.py uses the v1 API, so anything >=2.0 breaks imports.
    "mcp>=1.0.0,<2.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "pydantic>=2.6",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    # python-dotenv loads .env.local / .env into os.environ at startup so
    # that the Google OAuth client_id / client_secret (gitignored) reach
    # glacier_mcp.gee without ever appearing in the repository. See
    # src/glacier_mcp/__main__.py — the two load_dotenv() calls run BEFORE
    # any module that reads os.environ is imported.
    "python-dotenv>=1.0",
    # titiler: production-ready COG tile server. Handles large rasters
    # (>4096 px), mosaics, multi-layer overlays, and arbitrary CRSs — the
    # pieces we tried to build by hand. Exposes a ready FastAPI router
    # under /cog/tiles/{z}/{x}/{y}.png. See https://developmentseed.org/titiler/
    "titiler.core>=0.20",
    # rio-tiler is titiler's raster engine; pinning explicitly to avoid
    # version drift between titiler.core and its reader.
    "rio-tiler>=6.0",
    # Earth Engine + OAuth. See src/glacier_mcp/gee.py. earthengine-api
    # changes its auth surface a lot between majors, so this is a soft
    # pin to the 0.1.x line.
    "earthengine-api>=0.1.390",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "google-api-python-client>=2.120",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/LeonidYasin/glacier-mcp"

[project.scripts]
glacier-mcp = "glacier_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    # BLE001 (blind except) forces every ``except Exception:`` in the code
    # to carry an explicit ``# noqa: BLE001`` with a reason. We use that
    # to mark the handful of deliberate broad excepts in the OAuth / EE
    # plumbing (see app.py and gee.py) so the intent is visible at a glance.
    "BLE",
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "SLF",  # flake8-self (private member access)
]
ignore = [
    "B008",    # function call in default arg - FastAPI Depends() pattern
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
