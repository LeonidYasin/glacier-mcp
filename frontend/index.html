<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>glacier-mcp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.0.0/ol.css" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div id="toolbar">
      <label for="geotiff-file" class="btn">Load GeoTIFF</label>
      <input type="file" id="geotiff-file" accept=".tif,.tiff" />
      <span id="geotiff-info">No raster loaded — drawing works, map is blank.</span>
      <span id="status">loading...</span>
    </div>
    <div id="map"></div>
    <script src="https://cdn.jsdelivr.net/npm/ol@10.0.0/dist/ol.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>
    <script src="/static/main.js"></script>
  </body>
</html>
