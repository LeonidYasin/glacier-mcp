<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>glacier-mcp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.0.0/ol.css" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div id="toolbar">
      <label for="geotiff-file" class="btn">Load GeoTIFF</label>
      <input type="file" id="geotiff-file" accept=".tif,.tiff" />
      <button type="button" id="btn-draw" class="btn">Draw new polygon</button>
      <button type="button" id="btn-undo" class="btn btn-secondary" title="Undo last edit">Undo</button>
      <button type="button" id="btn-redo" class="btn btn-secondary" title="Redo last undone edit">Redo</button>
      <button type="button" id="btn-export" class="btn btn-accent" title="Download shapefile (ZIP)">Export shapefile</button>
      <span id="geotiff-info">No raster loaded — draw polygons, then export.</span>
      <span id="status">loading...</span>
    </div>

    <div id="map"></div>

    <!-- Debug HUD: shows zoom, resolution, mouse position in the raster CRS,
         and the loaded raster's identity/metadata. Toggle with "D". -->
    <div id="debug-hud" title="Press D to hide/show">
      <div class="hud-row"><b>Zoom</b><span id="hud-zoom">—</span></div>
      <div class="hud-row"><b>Resolution</b><span id="hud-resolution">—</span></div>
      <div class="hud-row"><b>Center</b><span id="hud-center">—</span></div>
      <div class="hud-row"><b>Mouse</b><span id="hud-mouse">—</span></div>
      <hr />
      <div class="hud-row"><b>Raster id</b><span id="hud-id">—</span></div>
      <div class="hud-row"><b>Filename</b><span id="hud-filename">—</span></div>
      <div class="hud-row"><b>Size</b><span id="hud-size">—</span></div>
      <div class="hud-row"><b>Bands</b><span id="hud-bands">—</span></div>
      <div class="hud-row"><b>CRS</b><span id="hud-crs">—</span></div>
      <div class="hud-row"><b>Extent</b><span id="hud-extent">—</span></div>
      <div class="hud-row"><b>Tile URL</b><span id="hud-tile-url">—</span></div>
    </div>

    <div id="polygon-panel">
      <span id="panel-label">Glaciers:</span>
      <div id="polygon-chips"></div>
      <button type="button" id="btn-show-all" class="btn btn-secondary" title="Open list of all polygons">
        Show all
      </button>
      <button type="button" id="btn-delete-selected" class="btn btn-danger" title="Delete the selected polygon (Del)" disabled>
        Delete selected
      </button>
    </div>

    <dialog id="polygon-modal">
      <header>
        <h2>Polygons (<span id="modal-count">0</span>)</h2>
        <input type="search" id="modal-search" placeholder="Search by name..." autocomplete="off" />
        <button type="button" id="modal-close" aria-label="Close">×</button>
      </header>
      <div id="modal-table-wrap">
        <table id="modal-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Vertices</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="modal-tbody"></tbody>
        </table>
        <p id="modal-empty" hidden>No polygons. Draw one in the map.</p>
      </div>
      <footer>
        <span id="modal-hint">Click a row to select the polygon on the map.</span>
      </footer>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/ol@10.0.0/dist/ol.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>
    <script src="/static/main.js"></script>
  </body>
</html>
